name: bed-038-x01
on:
  push:
    branches: [bed-038-x01-toolchain-abi]
    paths:
      - 'experiments/bed-038/x01/**'
      - '.github/workflows/bed-038-x01.yml'
permissions:
  contents: read
jobs:
  baseline-runner-account:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: python3 -c 'import os; print("B38 allocation",os.cpu_count(),os.getenv("ImageOS"),os.getenv("ImageVersion"))'
  resource-and-bootstrap-metadata:
    if: ${{ false }}
    needs: baseline-runner-account
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      B38_PHASE: disabled
      B38_PREFLIGHT: none
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Bounded bootstrap before any checkout or action acquisition
        id: b38_bootstrap
        run: |
          b38_stage=lease
          trap 'b38_rc=$?; printf "B38_BOOTSTRAP_FAILURE identity=secondary_or_unknown code=BOOTSTRAP_COMMAND_FAILURE stage=%s operation=%s exit=%s line=%s\n" "$b38_stage" "$b38_stage" "$b38_rc" "$LINENO" >&2' ERR
          sudo --preserve-env=GITHUB_WORKSPACE,GITHUB_RUN_ID,GITHUB_SHA,GITHUB_EVENT_NAME,GITHUB_REF,GITHUB_RUN_ATTEMPT timeout --kill-after=2s 5s python3 -B - <<'PY'
          try:
              import json,os,pathlib,sys
          except BaseException:
              print('B38_BOOTSTRAP_DIAGNOSTIC {"identity":"primary","stop":"BOOTSTRAP","stage":"lease","operation":"import_stdlib","code":"BOOTSTRAP_IMPORT_FAILURE","kind":"Exception","errno":null,"incomplete":true,"qualification":"provisional"}',flush=True)
              raise SystemExit(1)
          class BootstrapStop(Exception):
              def __init__(self,code): self.code=code
          def require(condition,code):
              if not condition: raise BootstrapStop(code)
          def kind(error):
              for cls in (BootstrapStop,PermissionError,FileNotFoundError,TimeoutError,OSError,ValueError,KeyError):
                  if isinstance(error,cls): return cls.__name__
              return 'Exception'
          operation='validate_event'
          try:
              require(os.environ['GITHUB_RUN_ATTEMPT']=='1' and os.environ['GITHUB_EVENT_NAME']=='push','LEASE_EVENT')
              require(os.environ['GITHUB_REF']=='refs/heads/bed-038-x01-toolchain-abi','LEASE_REF')
              operation='validate_ownership'
              lease=pathlib.Path('/mnt/b38-x01-lease');value=os.environ['GITHUB_RUN_ID']+':'+os.environ['GITHUB_SHA']
              require(len(value)<128 and not lease.exists(),'LEASE_NOT_EMPTY')
              require(not pathlib.Path('/mnt/b38-x01-scratch.ext4').exists() and not pathlib.Path('/mnt/b38-x01-external.ext4').exists(),'BACKING_NOT_EMPTY')
              operation='create_lease'
              with lease.open('x') as f: f.write(value)
              operation='verify_core_policy'
              require(not pathlib.Path('/proc/sys/kernel/core_pattern').read_text()[:4096].strip().startswith('|'),'HOST_CORE_PIPE_UNSUPPORTED')
          except BaseException as e:
              number=getattr(e,'errno',None)
              record={'identity':'primary','stop':'BOOTSTRAP','stage':'lease','operation':operation,
                      'code':e.code if isinstance(e,BootstrapStop) else 'BOOTSTRAP_OPERATION_FAILURE',
                      'kind':kind(e),'errno':number if type(number) is int and -4096<=number<=4096 else None,
                      'incomplete':True,'qualification':'provisional'}
              print('B38_BOOTSTRAP_DIAGNOSTIC '+json.dumps(record,separators=(',',':')),file=sys.stderr,flush=True)
              raise SystemExit(1)
          PY
          b38_stage=slice_start
          sudo timeout --kill-after=2s 8s systemctl start b38-x01.slice
          b38_stage=slice_limits
          sudo timeout --kill-after=2s 8s systemctl set-property --runtime b38-x01.slice CPUQuota=200% AllowedCPUs=0,1 MemoryMax=6G MemorySwapMax=0 TasksMax=128
          b38_stage=bootstrap_acquisition
          sudo --preserve-env=GITHUB_WORKSPACE,GITHUB_SHA,GITHUB_REF,GITHUB_EVENT_NAME,GITHUB_RUN_ATTEMPT,GITHUB_RUN_ID,ImageVersion,B38_PHASE timeout --kill-after=5s 85s systemd-run --quiet --pipe --wait --slice=b38-x01.slice --unit=b38-x01-bootstrap -p RuntimeMaxSec=80 -p TimeoutStartSec=5 -p TimeoutStopSec=2 -p KillMode=control-group -p LimitCORE=0 -p CPUQuota=200% -p AllowedCPUs=0,1 -p MemoryMax=6G -p MemorySwapMax=0 --setenv=GITHUB_WORKSPACE --setenv=GITHUB_SHA --setenv=GITHUB_REF --setenv=GITHUB_EVENT_NAME --setenv=GITHUB_RUN_ATTEMPT --setenv=GITHUB_RUN_ID --setenv=ImageVersion --setenv=B38_PHASE --setenv=PYTHONDONTWRITEBYTECODE=1 python3 -B - <<'PY' &
          try:
              import hashlib,json,os,pathlib,re,stat,subprocess,sys,tarfile,urllib.request
          except BaseException:
              print('B38_BOOTSTRAP_DIAGNOSTIC {"identity":"primary","stop":"BOOTSTRAP","stage":"bootstrap","operation":"import_stdlib","code":"BOOTSTRAP_IMPORT_FAILURE","kind":"Exception","errno":null,"incomplete":true,"qualification":"provisional"}',flush=True)
              raise SystemExit(1)
          class BootstrapStop(Exception):
              def __init__(self,code): self.code=code
          def require(condition,code):
              if not condition: raise BootstrapStop(code)
          def kind(error):
              for cls in (BootstrapStop,PermissionError,FileNotFoundError,TimeoutError,OSError,ValueError,KeyError):
                  if isinstance(error,cls): return cls.__name__
              return 'Exception'
          def cmd(*a): subprocess.run(a,check=True,timeout=15,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          class Redirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  require(urllib.parse.urlparse(newurl).hostname in ('api.github.com','codeload.github.com','raw.githubusercontent.com') and newurl.startswith('https://'),'ACQUISITION_REDIRECT')
                  return super().redirect_request(req,fp,code,msg,headers,newurl)
          def get(url,cap,path):
              with opener.open(url,timeout=15) as r, path.open('xb') as f:
                  size=0
                  while True:
                      b=r.read(min(65536,cap-size+1))
                      if not b: break
                      size+=len(b)
                      require(size<=cap,'ACQUISITION_CAP')
                      f.write(b)
              return path.read_bytes() if cap<=2*1024**2 else None
          Path=pathlib.Path
          PACKAGE='x01'
          S=Path('/mnt/b38-'+PACKAGE+'-scratch')
          IMAGE=Path(str(S)+'.ext4')
          class ControlError(BootstrapStop):
              def __init__(self,code,detail=None): super().__init__(code)
          SAFE_KINDS={'BootstrapStop','ControlError','PermissionError','FileNotFoundError','FileExistsError','IsADirectoryError','NotADirectoryError','TimeoutError','OSError','ValueError','UnicodeDecodeError','KeyError','Exception'}
          def close_fd_preserving(fd):
              primary=sys.exc_info()[1]
              try: os.close(fd)
              except BaseException as failure:
                  if primary is None: raise
                  saved=getattr(primary,'secondary_errors',[])
                  if len(saved)<4:
                      number=getattr(failure,'errno',None)
                      saved.append({'operation':'descriptor_close','code':'BOOTSTRAP_CLOSE_FAILURE',
                                    'kind':kind(failure),'errno':number if type(number) is int and -4096<=number<=4096 else None,
                                    'incomplete':True})
                      primary.secondary_errors=saved
                  else:
                      primary.secondary_omitted=getattr(primary,'secondary_omitted',0)+1
          class audit:
              @staticmethod
              def read(path,limit):
                  fd=os.open(path,os.O_RDONLY|os.O_CLOEXEC)
                  try:
                      data=b''
                      while len(data)<=limit:
                          part=os.read(fd,min(65536,limit+1-len(data)))
                          if not part: break
                          data+=part
                      if len(data)>limit: raise ControlError('MOUNT_STATE_UNKNOWN')
                      return data.decode('utf8')
                  finally: close_fd_preserving(fd)
              @staticmethod
              def mount_path(value):
                  return re.sub(r"\\([0-7]{3})",lambda match:chr(int(match[1],8)),value)
          class BoundedWriter:
              def __init__(self,fd,limit): self.fd=fd;self.limit=limit
              def write(self,data):
                  if len(data)>self.limit: raise ControlError('MOUNT_PROVENANCE_BOUND')
                  view=memoryview(data)
                  while view:
                      count=os.write(self.fd,view)
                      if count<=0: raise ControlError('MOUNT_PROVENANCE_UNKNOWN')
                      view=view[count:]

          # Mount identity is derived only for the exact owned target and its source.
          # All mount creation intents are durable before invoking mount(8).
          MOUNT_RECORD = Path('/mnt/b38-' + PACKAGE + '-mounts.json')

          def mount_graph(path):
              path=Path(path)
              allowed=(W,S,S/'control-fixtures'/'mount',S/'work')
              if path not in allowed: raise ControlError('MOUNT_SCOPE','target outside owned paths')
              try:
                  fd=os.open(path,os.O_PATH|os.O_NOFOLLOW|os.O_CLOEXEC)
                  try:
                      info=os.fstat(fd)
                      if not stat.S_ISDIR(info.st_mode): raise ValueError('not directory')
                      lines=audit.read('/proc/self/fdinfo/'+str(fd),4096).splitlines()
                      mids=[int(x.split(':',1)[1].strip()) for x in lines if x.startswith('mnt_id:')]
                      if len(mids)!=1 or mids[0]<=0: raise ValueError('effective id')
                      effective=mids[0]
                  finally: close_fd_preserving(fd)
                  lines=audit.read('/proc/self/mountinfo',524288).splitlines()
                  if len(lines)>512: raise ValueError('mount count')
                  matches=[];exact=[]
                  for line in lines:
                      left,right=line.split(' - ',1);fields=left.split();tail=right.split()
                      if len(fields)<6 or len(tail)<3: raise ValueError('mount fields')
                      mid=int(fields[0]);point=audit.mount_path(fields[4])
                      if mid!=effective and point!=str(path): continue
                      row={'id':mid,'parent':int(fields[1]),'device':fields[2],
                           'root':audit.mount_path(fields[3]),'path':point,
                           'filesystem':tail[0],'source':audit.mount_path(tail[1])}
                      if mid<=0 or row['parent']<=0: raise ValueError('invalid id')
                      if mid==effective: matches.append(row)
                      if point==str(path): exact.append(row)
                  if len(matches)!=1 or len(exact)>1 or exact and exact[0]!=matches[0]:
                      raise ValueError('ambiguous or stacked graph')
                  if matches[0]['device']!=str(os.major(info.st_dev))+':'+str(os.minor(info.st_dev)):
                      raise ValueError('device mismatch')
                  return {'effective':matches[0],'exact':exact,'stat':{'dev':info.st_dev,'ino':info.st_ino}}
              except BaseException as cause:
                  error=ControlError('MOUNT_STATE_UNKNOWN','mount identity unavailable or ambiguous')
                  error.operation='mount.identity'
                  number=getattr(cause,'errno',None)
                  if type(number) is int and -4096<=number<=4096: error.errno=number
                  error.origin_kind=type(cause).__name__ if type(cause).__name__ in SAFE_KINDS else 'Exception'
                  error.origin_incomplete=(type(cause).__name__ not in SAFE_KINDS or
                      (number is not None and not (type(number) is int and -4096<=number<=4096)))
                  error.secondary_errors=getattr(cause,'secondary_errors',[])
                  raise error from cause

          def mount_record_read():
              try:
                  fd=os.open(MOUNT_RECORD,os.O_RDONLY|os.O_NOFOLLOW|os.O_CLOEXEC)
                  try:
                      info=os.fstat(fd)
                      if (not stat.S_ISREG(info.st_mode) or info.st_uid!=0 or info.st_gid!=0
                          or stat.S_IMODE(info.st_mode)!=0o600 or info.st_nlink!=1 or info.st_size>16384):
                          raise ValueError('sidecar identity')
                      raw=os.read(fd,16385)
                      if len(raw)!=info.st_size: raise ValueError('sidecar size')
                  finally: close_fd_preserving(fd)
                  record=json.loads(raw)
                  if (not isinstance(record,dict) or set(record)!={'version','token','entries'}
                      or record['version']!=1 or record['token']!=os.environ['GITHUB_RUN_ID']+':'+os.environ['GITHUB_SHA']
                      or not isinstance(record['entries'],dict) or not set(record['entries'])<={'external','scratch','fixture'}):
                      raise ValueError('sidecar authority')
                  return record
              except BaseException as cause:
                  error=ControlError('MOUNT_PROVENANCE_UNKNOWN','mount provenance unavailable')
                  error.operation='mount.provenance'
                  number=getattr(cause,'errno',None)
                  if type(number) is int and -4096<=number<=4096: error.errno=number
                  error.origin_kind=type(cause).__name__ if type(cause).__name__ in SAFE_KINDS else 'Exception'
                  error.origin_incomplete=(type(cause).__name__ not in SAFE_KINDS or
                      (number is not None and not (type(number) is int and -4096<=number<=4096)))
                  error.secondary_errors=getattr(cause,'secondary_errors',[])
                  raise error from cause

          def mount_record_write(record):
              data=json.dumps(record,sort_keys=True,separators=(',',':')).encode()
              if len(data)>16384: raise ControlError('MOUNT_PROVENANCE_BOUND','record size')
              tmp=Path(str(MOUNT_RECORD)+'.tmp')
              fd=os.open(tmp,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW|os.O_CLOEXEC,0o600)
              try:
                  os.fchmod(fd,0o600)
                  if os.fstat(fd).st_uid!=0 or os.fstat(fd).st_gid!=0: raise ValueError('sidecar owner')
                  BoundedWriter(fd,16384).write(data);os.fsync(fd)
              finally: close_fd_preserving(fd)
              os.replace(tmp,MOUNT_RECORD)
              directory=os.open('/mnt',os.O_RDONLY|os.O_DIRECTORY|os.O_CLOEXEC)
              try: os.fsync(directory)
              finally: close_fd_preserving(directory)

          def mount_source_stat(path,mode):
              info=os.stat(path,follow_symlinks=False)
              if mode=='loop' and not stat.S_ISREG(info.st_mode) or mode=='bind' and not stat.S_ISDIR(info.st_mode):
                  raise ControlError('MOUNT_SOURCE_UNKNOWN','source type')
              return {'dev':info.st_dev,'ino':info.st_ino}

          def mount_validate(name,entry,view):
              expected={'external':(W,Path('/mnt/b38-'+PACKAGE+'-external.ext4'),'loop'),
                        'scratch':(S,IMAGE,'loop'),
                        'fixture':(S/'control-fixtures'/'mount',S/'work','bind')}
              if name not in expected or not isinstance(entry,dict) or set(entry)!={'state','target','underlying','mount','source','source_stat','mode'}:
                  raise ControlError('MOUNT_PROVENANCE_UNKNOWN','invalid entry')
              target,source,mode=expected[name]
              if entry['target']!=str(target) or entry['source']!=str(source) or entry['mode']!=mode:
                  raise ControlError('MOUNT_PROVENANCE_UNKNOWN','unexpected path')
              row=entry['mount'];underlying=entry['underlying']
              row_keys={'id','parent','device','root','path','filesystem','source'}
              if (not isinstance(row,dict) or set(row)!=row_keys or not isinstance(underlying,dict)
                  or set(underlying)!=row_keys or row['path']!=str(target) or row['parent']!=underlying['id']
                  or any(type(r[k]) is not int or r[k]<=0 for r in (row,underlying) for k in ('id','parent'))
                  or any(not isinstance(r[k],str) for r in (row,underlying) for k in ('device','root','path','filesystem','source'))
                  or not isinstance(entry['source_stat'],dict) or set(entry['source_stat'])!={'dev','ino'}
                  or any(type(entry['source_stat'][k]) is not int for k in ('dev','ino'))
                  or entry['source_stat']['dev']<0 or entry['source_stat']['ino']<=0 or row['id']==underlying['id']):
                  raise ControlError('MOUNT_PROVENANCE_UNKNOWN','invalid mount identity')
              if entry['state'] in ('removed','released'):
                  if entry['state']=='released' and mode!='loop': raise ControlError('MOUNT_PROVENANCE_UNKNOWN','invalid released state')
                  if view['exact'] or view['effective']!=underlying:
                      raise ControlError('MOUNT_STATE_UNKNOWN','removed identity changed')
                  return
              if mount_source_stat(source,mode)!=entry['source_stat']:
                  raise ControlError('MOUNT_OWNERSHIP_UNKNOWN','source changed')
              if entry['state']!='mounted' or view['exact']!=[entry['mount']] or view['effective']!=entry['mount']:
                  raise ControlError('MOUNT_OWNERSHIP_UNKNOWN','owned mount not established')
              row=entry['mount'];underlying=entry['underlying']
              if row['parent']!=underlying['id'] or row['id']==underlying['id']:
                  raise ControlError('MOUNT_OWNERSHIP_UNKNOWN','mount parent changed')
              if mode=='loop':
                  if row['filesystem']!='ext4' or row['root']!='/': raise ControlError('MOUNT_OWNERSHIP_UNKNOWN','loop filesystem')
                  backing=audit.read('/sys/dev/block/'+row['device']+'/loop/backing_file',4096).strip()
                  if backing!=str(source): raise ControlError('MOUNT_OWNERSHIP_UNKNOWN','loop backing')
              else:
                  source_view=mount_graph(source);base=source_view['effective']
                  try: relative=source.relative_to(Path(base['path']))
                  except ValueError as cause: raise ControlError('MOUNT_SOURCE_UNKNOWN','source graph') from cause
                  expected_root=str(Path(base['root'])/relative)
                  if (view['stat']!=entry['source_stat'] or row['device']!=base['device'] or
                      row['filesystem']!=base['filesystem'] or row['root']!=expected_root):
                      raise ControlError('MOUNT_SOURCE_UNKNOWN','bind source identity')

          def mount_begin(name,target,source,mode):
              record=mount_record_read();previous=record['entries'].get(name)
              if previous and previous.get('state')!='removed': raise ControlError('MOUNT_PREEXISTS','ownership unresolved')
              view=mount_graph(target)
              if view['exact']: raise ControlError('MOUNT_PREEXISTS','target mounted')
              if previous: mount_validate(name,previous,view)
              record['entries'][name]={'state':'pending','target':str(target),'underlying':view['effective'],
                 'mount':None,'source':str(source),'source_stat':mount_source_stat(source,mode),'mode':mode}
              mount_record_write(record)

          def mount_commit(name):
              record=mount_record_read();entry=record['entries'][name]
              if entry.get('state')!='pending': raise ControlError('MOUNT_PROVENANCE_UNKNOWN','no intent')
              view=mount_graph(Path(entry['target']))
              if len(view['exact'])!=1: raise ControlError('MOUNT_CREATION_UNPROVEN','no exact mount')
              prospective=dict(entry,state='mounted',mount=view['exact'][0])
              mount_validate(name,prospective,view)
              # Re-read graph before making the proof durable. A changed mount is unknown.
              if mount_graph(Path(entry['target']))!=view: raise ControlError('MOUNT_STATE_UNKNOWN','mount changed')
              record['entries'][name]=prospective;mount_record_write(record)
              return prospective

          stage='bootstrap';operation='workspace_identity';failure_ready=False;W=None
          try:
              operation='initialize_acquisition';opener=urllib.request.build_opener(urllib.request.ProxyHandler({}),Redirect())
              operation='workspace_identity'
              W=pathlib.Path(os.environ['GITHUB_WORKSPACE']);E=pathlib.Path('/mnt/b38-x01-external.ext4')
              operation='resource_envelope'
              cg=pathlib.Path('/sys/fs/cgroup')/pathlib.Path('/proc/self/cgroup').read_text().split('0:',1)[1].strip().lstrip('/')
              effective={n:(cg/n).read_text().strip() for n in ('memory.max','memory.swap.max','cpu.max','cpuset.cpus.effective')}
              quota,period=map(int,effective['cpu.max'].split());require(0<quota<=2*period,'BOOTSTRAP_CPU')
              require(effective['memory.max']==str(6*1024**3) and effective['memory.swap.max']=='0' and os.sched_getaffinity(0)=={0,1},'BOOTSTRAP_ENVELOPE')
              operation='validate_run'
              require(os.uname().machine=='x86_64','HOST_ARCHITECTURE')
              require(os.environ['GITHUB_RUN_ATTEMPT']=='1','RERUN_FORBIDDEN')
              require(os.environ['GITHUB_EVENT_NAME']=='push' and os.environ['GITHUB_REF']=='refs/heads/bed-038-x01-toolchain-abi','BOOTSTRAP_EVENT')
              require(os.environ['B38_PHASE']=='preflight','BOOTSTRAP_PHASE')
              operation='verify_ownership'
              L=pathlib.Path('/mnt/b38-x01-lease');owned=os.environ['GITHUB_RUN_ID']+':'+os.environ['GITHUB_SHA']
              require(len(owned)<128 and L.read_text()==owned and not os.path.lexists(E) and not os.path.lexists('/mnt/b38-x01-scratch.ext4') and not list(W.iterdir()),'BOOTSTRAP_NOT_EMPTY')
              operation='verify_headroom'
              require(__import__('shutil').disk_usage(W).free>=12*1024**3,'DISK_HEADROOM')
              require(int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')))*1024>=7*1024**3,'MEMORY_HEADROOM')
              operation='allocate_external';cmd('fallocate','-l',str(120*1024**2),str(E))
              operation='format_external';cmd('mkfs.ext4','-q','-m','2',str(E))
              operation='mount_provenance_init'
              require(not os.path.lexists(MOUNT_RECORD),'MOUNT_PROVENANCE_EXISTS')
              entries={}
              if PACKAGE=='x03' and os.environ['B38_PHASE']=='admission':
                  entries['fixture']={'state':'not_requested'}
              mount_record_write({'version':1,'token':owned,'entries':entries})
              operation='mount_external_intent';mount_begin('external',W,E,'loop')
              operation='mount_external';cmd('mount','-o','loop,nodev,nosuid',str(E),str(W))
              operation='mount_external_capture';mount_commit('external');os.chmod(W,0o755)
              operation='initialize_evidence';(W/'failure.json').write_bytes(b' '*65536);failure_ready=True
              (W/'tmp').mkdir();(W/'out').mkdir()
              operation='bootstrap_unit_identity'
              invocation=os.environ.get('INVOCATION_ID','')
              group=pathlib.Path('/proc/self/cgroup').read_text().split('0::',1)[1].strip()
              require(re.fullmatch('[0-9a-f]{32}',invocation) is not None and
                      group.endswith('/b38-'+PACKAGE+'.slice/b38-'+PACKAGE+'-bootstrap.service'),
                      'BOOTSTRAP_UNIT_IDENTITY')
              identity={'version':1,'package':PACKAGE,'run_id':os.environ['GITHUB_RUN_ID'],
                        'commit':os.environ['GITHUB_SHA'],'unit':{'Id':'b38-'+PACKAGE+'-bootstrap.service',
                        'InvocationID':invocation,'ControlGroup':group,'Job':None}}
              identity_raw=json.dumps(identity,sort_keys=True,separators=(',',':')).encode()
              identity_fd=os.open(W/'out/inventory-bootstrap.json',os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW|os.O_CLOEXEC,0o600)
              try:
                  os.fchmod(identity_fd,0o600);BoundedWriter(identity_fd,16384).write(identity_raw);os.fsync(identity_fd)
              finally: os.close(identity_fd)
              operation='adapter_inventory_intent'
              adapter={'version':1,'package':PACKAGE,'run_id':os.environ['GITHUB_RUN_ID'],
                       'commit':os.environ['GITHUB_SHA'],
                       'scope':{'id':'b38-'+PACKAGE+'-adapter.scope','invocation_id':None,
                                'control_group':None,'job_id':None,'state':'intent'},
                       'adapter_pid':None,'adapter_start_ticks':None,
                       'upload_client':{'pid':None,'start_ticks':None,'status':None,'signal':None,'state':'not_started'},
                       'adapter_complete':False,'incomplete':True}
              raw=json.dumps(adapter,sort_keys=True,separators=(',',':')).encode()
              fd=os.open(W/'inventory-adapter.json',os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW|os.O_CLOEXEC,0o600)
              try:
                  os.fchmod(fd,0o600);BoundedWriter(fd,65536).write(raw);os.fsync(fd)
              finally: os.close(fd)
              stage='source';operation='fetch_tree'
              sha=os.environ['GITHUB_SHA'];api='https://api.github.com/repos/gregkrsak/bowfin/'
              tree=json.loads(get(api+'git/trees/'+sha+'?recursive=1',2*1024**2,W/'tree.json'))
              require(not tree.get('truncated') and len(tree['tree'])<=2048,'SOURCE_TREE_CAP')
              blobs={x['path']:x for x in tree['tree'] if x['type']=='blob'}
              operation='fetch_archive';get(api+'tarball/'+sha,16*1024**2,W/'source.tgz')
              operation='verify_archive';S=W/'source';S.mkdir();seen=set();total=0
              with tarfile.open(W/'source.tgz','r|gz') as tar:
                  count=0
                  for m in tar:
                      count+=1;require(count<=4096,'SOURCE_MEMBER_COUNT')
                      parts=pathlib.PurePosixPath(m.name).parts[1:]
