                          str(os.major(saved['dev']))+':'+str(os.minor(saved['dev']))!=row['device']):
                          raise TeardownStop('MOUNT_PROVENANCE_UNKNOWN')
                      continue
                  release_mount(name);record=mount_record_read()
              hygiene['incomplete']=True
              hygiene['owned_record_removal']='pending_after_transport'
              emit('cleanup_provisional',dict(hygiene,primary=teardown_primary[0] if teardown_primary else None,secondary=secondary))
              if teardown_primary or secondary: raise SystemExit(1)
              # The prior record is expressly provisional. The final success
              # follows removal; failed final transport leaves the step failed.
              os.unlink(LEASE);os.unlink(MOUNT_RECORD)
              hygiene['owned_record_removal']='complete';hygiene['incomplete']=False
              emit('cleanup_final',dict(hygiene,primary=teardown_primary[0] if teardown_primary else None,secondary=secondary))
          except SystemExit: raise
          except BaseException as failure:
              error(stage,failure)
              hygiene['incomplete']=True;hygiene['package_hygiene']='incomplete'
              # Do not stop the parent slice on an exception: doing so could
              # indirectly stop children whose ownership has not been proved.
              try: emit('cleanup',dict(hygiene,primary=teardown_primary[0] if teardown_primary else None,secondary=secondary,retention='owned evidence retained where removal was not completed'))
              except BaseException: pass
              raise SystemExit(1)
          PY
