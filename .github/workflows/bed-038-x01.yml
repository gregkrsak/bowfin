          sudo --preserve-env=GITHUB_WORKSPACE,GITHUB_RUN_ID,GITHUB_SHA,GITHUB_EVENT_NAME,GITHUB_REF,GITHUB_RUN_ATTEMPT timeout --kill-after=2s 5s python3 -B - <<'PY'
          try:
