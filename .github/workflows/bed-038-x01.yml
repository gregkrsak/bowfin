                      or record['version']!=1 or record['token']!=os.environ['GITHUB_RUN_ID']+':'+os.environ['GITHUB_SHA']
                      or not isinstance(record['entries'],dict) or not set(record['entries'])<={'external','scratch','fixture'}):
