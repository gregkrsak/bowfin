                  while len(core_bytes)<4096:
                      part=core_file.read(4096-len(core_bytes))
                      if not part: break
                      core_bytes.extend(part)
              complete=len(core_bytes)<4096
              observation={'bytes':len(core_bytes),'sha256':hashlib.sha256(core_bytes).hexdigest(),
                           'digest_scope':'complete' if complete else 'observed_prefix',
                           'complete':complete,'encoding':'base64',
                           'value':base64.b64encode(core_bytes).decode('ascii')}
