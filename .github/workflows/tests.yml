name: tests

on:
  push:
  pull_request:

jobs:
  compiler-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Enforce Rust host-toolchain constraints
        run: |
          printf 'TC-001 checkout commit=%s tree=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"
          python3 scripts/verify-rustc-164250.py
          python3 scripts/tests/test_verify_rustc_164250.py
          python3 scripts/tests/test_probe_rustc_164250.py
          python3 scripts/probe-rustc-164250.py --expect affected --expected-version 1.80.0

      - name: Run compiler unit tests
        shell: bash
        run: |
          set -o pipefail
          B34_EVIDENCE_DIR="$RUNNER_TEMP/bed034-debug-evidence" cargo test --locked --workspace 2>&1 | tee "$RUNNER_TEMP/bed034-debug.log"
          python scripts/verify-bed035-tests.py "$RUNNER_TEMP/bed034-debug.log"
          python scripts/verify-bed034-budgets.py "$RUNNER_TEMP/bed034-debug-evidence"

      - name: Verify arithmetic checks in optimized builds
        shell: bash
        run: |
          set -o pipefail
          B34_EVIDENCE_DIR="$RUNNER_TEMP/bed034-release-evidence" cargo test --locked --workspace --release 2>&1 | tee "$RUNNER_TEMP/bed034-release.log"
          python scripts/verify-bed035-tests.py "$RUNNER_TEMP/bed034-release.log"
          python scripts/verify-bed034-budgets.py "$RUNNER_TEMP/bed034-release-evidence"

      - name: Verify compact and explicit examples remain present
        run: |
          grep -q "verified fn consume" examples/battery_fail.bow
          grep -q "verified function consume" examples/battery_ok.bow
